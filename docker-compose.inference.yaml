services:
  pill-inference:
    build:
      context: ./backend
      dockerfile: pill_inference_package/Dockerfile
    image: pill-inference
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - medicine-inference
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  medicine-inference:
    name: medicine-inference-net
