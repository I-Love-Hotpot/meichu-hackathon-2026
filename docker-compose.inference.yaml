name: meichu-pill-inference

services:
  pill-inference:
    build:
      context: ./pill_cnn
      dockerfile: Dockerfile
    image: meichu-pill-inference:local
    init: true
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - medicine-inference
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    expose:
      - 8000

networks:
  medicine-inference:
    external: true
