services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-backend}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - db-net

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - 8080
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DEFAULT_USER=${DB_USER:-root}
      - ADMINER_DEFAULT_PASSWORD=${DB_PASSWORD:-root}
      - ADMINER_DEFAULT_DB_NAME=${DB_DATABASE:-backend}
    networks:
      - coolify
      - db-net
volumes:
  mariadb_prod_data:

networks:
  coolify:
    external: true
  db-net:
    external: true
