services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      MEDICINE_INFERENCE_URL: http://pill-inference:8000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - coolify
      - db-net
      - medicine-inference

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - coolify

networks:
  coolify:
    external: true
  db-net:
    external: true
  medicine-inference:
    external: true
    name: medicine-inference-net
