services:
  dev-backend:
    image: backend
    build:
      context: ./backend
      dockerfile: ./Dockerfile.dev
    restart: unless-stopped
    networks:
      default:
        aliases:
          - medicine-api
    env_file:
      - .env
    environment:
      DB_HOST: dev-db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_DATABASE: ${DB_DATABASE:-backend}
      # - REDIS_HOST=redis
    volumes:
      - ./backend:/app/
      - ./.env:/app/.env:ro
      - /app/node_modules/
    ports:
      - 3001:3001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      dev-db:
        condition: service_healthy
      # redis:
      #   condition: service_started
  dev-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-backend}
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
  # redis:
  #   image: redis:latest
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - 3002:8080
    environment:
      - ADMINER_DEFAULT_SERVER=dev-db
      - ADMINER_DEFAULT_USER=${DB_USER:-root}
      - ADMINER_DEFAULT_PASSWORD=${DB_PASSWORD:-root}
      - ADMINER_DEFAULT_DB_NAME=${DB_DATABASE:-backend}
  # redis-commander:
  #   image: ghcr.io/joeferner/redis-commander:latest
  #   restart: always
  #   environment:
  #     - REDIS_HOSTS=redis
  #   ports:
  #     - 3013:8081
  dev-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules/
    ports:
      - "8080:5173"
