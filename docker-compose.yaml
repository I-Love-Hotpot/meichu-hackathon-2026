services:
  db:
    image: postgres:16-alpine
    container_name: cloudphone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudphone}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cloudphone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  webadmin:
    image: adminer:4.8.1-standalone
    container_name: cloudphone-webadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: nette
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: cloudphone-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cloudphone}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CLOUDPHONE_BASE_URL: ${CLOUDPHONE_BASE_URL:-https://your-cloudphone-api.example.com}
      CLOUDPHONE_WIDGET_URL: ${CLOUDPHONE_WIDGET_URL:-https://your-cloudphone-widget.example.com}
      CLOUDPHONE_API_KEY: ${CLOUDPHONE_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudphone-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
